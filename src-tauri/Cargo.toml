[package]
name = "elecxterm"
version = "0.0.17"
description = "Next-generation terminal multiplexer for the elecxzy ecosystem"
authors = ["elecxzy project"]
edition = "2024"

[lib]
name = "elecxterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# プラグイン
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
dashmap = "6.2"
thiserror = "2.0"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
